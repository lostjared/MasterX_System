<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MasterX - Canvas + Stdout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background-color: black;
      text-align: center;
    }

    #mx-wrapper {
      display: inline-block;
    }

    .emscripten_border {
      display: inline-block;
      border: none;
    }

    canvas.emscripten {
      background-color: #000;
      display: block;
      border: none;
    }

    #output {
      background-color: black;
      color: green;
      height: 180px;
      margin-top: 12px;
      font-family: monospace;
      white-space: pre;
      overflow: auto;
      display: block;
      margin-left: auto;
      margin-right: auto;
      border: none;
    }

    #controls {
      margin-top: 8px;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      color: #ebebeb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
      transition: opacity 0.4s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading h1 {
      margin: 0 0 24px 0;
      font-size: 28px;
      color: #bdd72e;
      letter-spacing: 2px;
    }

    .spinner {
      height: 48px;
      width: 48px;
      margin-bottom: 18px;
      display: inline-block;
      vertical-align: top;
      animation: rotation 0.8s linear infinite;
      border-left: 6px solid #2a2a2a;
      border-right: 6px solid #2a2a2a;
      border-bottom: 6px solid #2a2a2a;
      border-top: 6px solid #bdd72e;
      border-radius: 100%;
      background-color: transparent;
      box-sizing: border-box;
    }

    @keyframes rotation {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #status {
      font-weight: 700;
      color: #bdd72e;
      margin-bottom: 12px;
      font-size: 14px;
      min-height: 18px;
      text-align: center;
    }

    #progress {
      height: 16px;
      width: 360px;
      max-width: 80vw;
      accent-color: #bdd72e;
    }

    #loading-detail {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div id="loading">
    <h1>MasterX</h1>
    <div class="spinner" id="spinner"></div>
    <div id="status">Downloading...</div>
    <progress id="progress" max="100" value="0"></progress>
    <div id="loading-detail"></div>
  </div>

  <h2>MasterX</h2>

  <div id="mx-wrapper">
    <div class="emscripten_border">
	<canvas class="emscripten" id="canvas" width="1280" height="720"
          style="width:1280px;height:720px"
          oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div id="controls">
      <button id="clear">Clear stdout</button>
    </div>

    <textarea id="output" readonly spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
  </div>

  <script>
    var outputElement = document.getElementById('output');
    var canvasElement = document.getElementById('canvas');
    var ignoredErrMessages = [
      'emscripten_set_main_loop_timing: Cannot set timing mode for main loop since a main loop does not exist! Call emscripten_set_main_loop first to set one up.'
    ];

    function shouldIgnoreErr(text) {
      return ignoredErrMessages.indexOf(text) !== -1;
    }

    function syncOutputSize() {
      if (!canvasElement || !outputElement) return;
      var rect = canvasElement.getBoundingClientRect();
      outputElement.style.width = rect.width + 'px';
    }

    syncOutputSize();

    var resizeObserver = new ResizeObserver(syncOutputSize);
    resizeObserver.observe(canvasElement);
    window.addEventListener('resize', syncOutputSize);

    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var spinnerElement = document.getElementById('spinner');
    var loadingElement = document.getElementById('loading');
    var loadingDetailElement = document.getElementById('loading-detail');

    var hideLoading = function() {
      if (!loadingElement || loadingElement.classList.contains('hidden')) return;
      loadingElement.classList.add('hidden');
      setTimeout(function() {
        if (loadingElement && loadingElement.parentNode) {
          loadingElement.parentNode.removeChild(loadingElement);
        }
      }, 600);
    };

    var Module = {
      canvas: canvasElement,
      print: function() {
        var e = Array.prototype.slice.call(arguments);
        console.log.apply(console, e);
        if (outputElement) {
          var t = e.join(" ");
          outputElement.value += t + '\n';
          outputElement.scrollTop = outputElement.scrollHeight;
        }
      },
      printErr: function() {
        var e = Array.prototype.slice.call(arguments);
        var t = e.join(" ");
        if (shouldIgnoreErr(t)) return;
        console.error.apply(console, e);
        if (outputElement) {
          outputElement.value += '[ERR] ' + t + '\n';
          outputElement.scrollTop = outputElement.scrollHeight;
        }
      },
      setStatus: function(e) {
        if (Module.setStatus.last == null) {
          Module.setStatus.last = { time: Date.now(), text: "" };
        }
        if (e !== Module.setStatus.last.text) {
          var t = e.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var n = Date.now();
          if (!t || n - Module.setStatus.last.time >= 30) {
            Module.setStatus.last.time = n;
            Module.setStatus.last.text = e;
            if (t) {
              e = t[1];
              progressElement.value = 100 * parseInt(t[2]);
              progressElement.max = 100 * parseInt(t[4]);
              progressElement.hidden = false;
              spinnerElement.hidden = false;
              if (loadingDetailElement) {
                loadingDetailElement.textContent = t[2] + ' / ' + t[4];
              }
            } else {
              progressElement.removeAttribute('value');
              progressElement.removeAttribute('max');
              progressElement.hidden = true;
              if (!e) spinnerElement.style.display = "none";
              if (loadingDetailElement) loadingDetailElement.textContent = '';
            }
            statusElement.innerHTML = e;
            if (e === 'All downloads complete.' || /complete/i.test(e) === false && e === '') {
              // Will hide on runtime init below.
            }
          }
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(e) {
        this.totalDependencies = Math.max(this.totalDependencies, e);
        Module.setStatus(
          e
            ? "Preparing... (" + (this.totalDependencies - e) + "/" + this.totalDependencies + ")"
            : "All downloads complete."
        );
      },
      onRuntimeInitialized: function() {
        console.log('Emscripten runtime initialized');
        Module.setStatus('Ready');
        hideLoading();
      }
    };

    window.addEventListener('error', function(ev) {
      if (statusElement) statusElement.textContent = 'Error: see console';
      if (spinnerElement) spinnerElement.style.display = 'none';
    });

    // Stream the wasm download manually so we can show byte-level progress
    // before Emscripten itself reports anything. We defer loading MasterX.js
    // until the prefetch finishes (or fails), then hand the bytes to
    // Emscripten via Module.wasmBinary so it skips its own fetch.
    var loadEmscripten = function() {
      if (loadEmscripten.called) return;
      loadEmscripten.called = true;
      var s = document.createElement('script');
      s.src = 'MasterX.js?v=1.1.0z';
      s.async = true;
      document.body.appendChild(s);
    };

    (function fetchWasmWithProgress() {
      var wasmUrl = 'MasterX.wasm';
      if (!('fetch' in window) || !('Response' in window) || !('ReadableStream' in window)) {
        loadEmscripten();
        return;
      }
      try {
        fetch(wasmUrl).then(function(resp) {
          if (!resp.ok || !resp.body) { loadEmscripten(); return null; }
          var total = parseInt(resp.headers.get('Content-Length') || '0', 10);
          var loaded = 0;
          var reader = resp.body.getReader();
          var chunks = [];
          function fmt(bytes) {
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
            if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
            return bytes + ' B';
          }
          function pump() {
            return reader.read().then(function(r) {
              if (r.done) {
                if (statusElement) statusElement.textContent = 'Initializing...';
                if (loadingDetailElement && total) loadingDetailElement.textContent = fmt(total) + ' / ' + fmt(total);
                return new Blob(chunks);
              }
              chunks.push(r.value);
              loaded += r.value.length;
              if (total > 0) {
                progressElement.max = 100;
                progressElement.value = Math.floor((loaded / total) * 100);
                progressElement.hidden = false;
                if (statusElement) statusElement.textContent = 'Downloading WebAssembly...';
                if (loadingDetailElement) loadingDetailElement.textContent = fmt(loaded) + ' / ' + fmt(total);
              } else {
                if (loadingDetailElement) loadingDetailElement.textContent = fmt(loaded) + ' downloaded';
              }
              return pump();
            });
          }
          return pump().then(function(blob) {
            if (!blob) { loadEmscripten(); return; }
            return blob.arrayBuffer().then(function(buf) {
              Module.wasmBinary = buf;
              loadEmscripten();
            });
          });
        }).catch(function(err) {
          console.warn('Wasm prefetch failed, falling back to default loader:', err);
          loadEmscripten();
        });
      } catch (e) {
        console.warn('Wasm prefetch unavailable:', e);
        loadEmscripten();
      }
    })();

    document.getElementById('clear').addEventListener('click', function() {
      outputElement.value = '';
    });
  </script>
</body>
</html>
